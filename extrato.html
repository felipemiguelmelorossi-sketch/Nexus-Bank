<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Extrato — BancoPix</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
</head>

<body>

    <!-- HEADER -->

    <header class="topbar">

        <div class="logo">
            Banco<span>Pix</span>
        </div>

        <button
            class="profile-button"
            type="button"
            onclick="location.href='index.html'"
        >
            ←
        </button>

    </header>


    <!-- CONTEÚDO -->

    <main class="container">

        <section class="welcome">

            <p>BancoPix</p>

            <h1>Extrato</h1>

            <p>
                Confira suas movimentações.
            </p>

        </section>


        <!-- SALDO -->

        <section class="balance-card">

            <div>

                <p class="balance-title">
                    Saldo disponível
                </p>

                <h2 id="extratoSaldo">
                    R$ 0,00
                </h2>

            </div>

        </section>


        <!-- MOVIMENTAÇÕES -->

        <section class="transactions">

            <div class="section-header">

                <h2>
                    Movimentações
                </h2>

                <button
                    type="button"
                    id="limparFiltro"
                >
                    Todas
                </button>

            </div>


            <!-- FILTROS -->

            <div class="extrato-filtros">

                <button
                    type="button"
                    class="filtro ativo"
                    data-filtro="todos"
                >
                    Todas
                </button>

                <button
                    type="button"
                    class="filtro"
                    data-filtro="entrada"
                >
                    Entradas
                </button>

                <button
                    type="button"
                    class="filtro"
                    data-filtro="saida"
                >
                    Saídas
                </button>

            </div>


            <!-- LISTA -->

            <div id="listaMovimentacoes">

                <div class="empty-state">

                    <div class="empty-icon">
                        ⏳
                    </div>

                    <h3>
                        Carregando extrato...
                    </h3>

                    <p>
                        Buscando suas movimentações.
                    </p>

                </div>

            </div>

        </section>

    </main>


    <!-- MENU INFERIOR -->

    <nav class="bottom-nav">

        <button
            type="button"
            onclick="location.href='index.html'"
        >

            <span>⌂</span>

            Início

        </button>


        <button
            type="button"
            onclick="location.href='pix.html'"
        >

            <span>⚡</span>

            PIX

        </button>


        <button
            class="active"
            type="button"
        >

            <span>📋</span>

            Extrato

        </button>


        <button type="button">

            <span>👤</span>

            Perfil

        </button>

    </nav>


    <script>

        // =====================================================
        // BANCO PIX — EXTRATO
        // =====================================================

        const lista =
            document.getElementById(
                "listaMovimentacoes"
            );

        const saldo =
            document.getElementById(
                "extratoSaldo"
            );

        const filtros =
            document.querySelectorAll(
                ".filtro"
            );

        const limparFiltro =
            document.getElementById(
                "limparFiltro"
            );


        let movimentacoes = [];


        // =====================================================
        // FORMATAR VALOR
        // =====================================================

        function formatarValor(valor) {

            return Number(valor).toLocaleString(
                "pt-BR",
                {
                    style: "currency",
                    currency: "BRL"
                }
            );

        }


        // =====================================================
        // FORMATAR DATA
        // =====================================================

        function formatarData(data) {

            if (!data) {
                return "Data não informada";
            }

            const dataObjeto =
                new Date(data);

            return dataObjeto.toLocaleString(
                "pt-BR",
                {
                    day: "2-digit",
                    month: "2-digit",
                    year: "numeric",
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

        }


        // =====================================================
        // MOSTRAR MOVIMENTAÇÕES
        // =====================================================

        function mostrarMovimentacoes(
            filtro = "todos"
        ) {

            let dados =
                movimentacoes;


            if (filtro !== "todos") {

                dados =
                    movimentacoes.filter(
                        item =>
                            item.tipo === filtro
                    );

            }


            if (dados.length === 0) {

                lista.innerHTML = `

                    <div class="empty-state">

                        <div class="empty-icon">
                            📋
                        </div>

                        <h3>
                            Nenhuma movimentação
                        </h3>

                        <p>
                            Não encontramos movimentações nesse filtro.
                        </p>

                    </div>

                `;

                return;

            }


            lista.innerHTML = "";


            dados.forEach(
                movimentacao => {

                    const item =
                        document.createElement(
                            "div"
                        );


                    item.className =
                        "movimentacao";


                    const entrada =
                        movimentacao.tipo ===
                        "entrada";


                    const sinal =
                        entrada
                            ? "+"
                            : "-";


                    const icone =
                        entrada
                            ? "↓"
                            : "↑";


                    item.innerHTML = `

                        <div class="movimentacao-info">

                            <div class="movimentacao-icon">
                                ${icone}
                            </div>

                            <div>

                                <strong>
                                    ${escaparHTML(
                                        movimentacao.titulo
                                    )}
                                </strong>

                                <p>
                                    ${escaparHTML(
                                        movimentacao.descricao ||
                                        "Sem descrição"
                                    )}
                                </p>

                                <small>
                                    ${formatarData(
                                        movimentacao.created_at
                                    )}
                                </small>

                            </div>

                        </div>


                        <strong
                            class="
                                movimentacao-valor
                                ${movimentacao.tipo}
                            "
                        >

                            ${sinal}
                            ${formatarValor(
                                movimentacao.valor
                            )}

                        </strong>

                    `;


                    lista.appendChild(item);

                }
            );

        }


        // =====================================================
        // CALCULAR SALDO
        // =====================================================

        function calcularSaldo() {

            let total = 0;


            movimentacoes.forEach(
                movimentacao => {

                    const valor =
                        Number(
                            movimentacao.valor
                        );


                    if (
                        movimentacao.tipo ===
                        "entrada"
                    ) {

                        total += valor;

                    } else {

                        total -= valor;

                    }

                }
            );


            saldo.textContent =
                formatarValor(total);

        }


        // =====================================================
        // BUSCAR TRANSAÇÕES NO SUPABASE
        // =====================================================

        async function carregarExtrato() {

            try {

                const {
                    data: {
                        session
                    },
                    error: sessionError
                } =
                    await supabaseClient.auth
                        .getSession();


                if (sessionError) {
                    throw sessionError;
                }


                // Usuário não está logado

                if (!session) {

                    window.location.href =
                        "login.html";

                    return;

                }


                // Buscar somente as transações
                // pertencentes ao usuário logado

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .from("transactions")
                        .select("*")
                        .eq(
                            "user_id",
                            session.user.id
                        )
                        .order(
                            "created_at",
                            {
                                ascending: false
                            }
                        );


                if (error) {
                    throw error;
                }


                movimentacoes =
                    data || [];


                mostrarMovimentacoes();

                calcularSaldo();


            } catch (error) {

                console.error(
                    "Erro ao carregar extrato:",
                    error
                );


                lista.innerHTML = `

                    <div class="empty-state">

                        <div class="empty-icon">
                            ⚠️
                        </div>

                        <h3>
                            Não foi possível carregar
                        </h3>

                        <p>
                            ${escaparHTML(
                                error.message ||
                                "Ocorreu um erro."
                            )}
                        </p>

                    </div>

                `;

            }

        }


        // =====================================================
        // FILTROS
        // =====================================================

        filtros.forEach(
            filtro => {

                filtro.addEventListener(
                    "click",
                    () => {

                        filtros.forEach(
                            botao => {

                                botao.classList.remove(
                                    "ativo"
                                );

                            }
                        );


                        filtro.classList.add(
                            "ativo"
                        );


                        mostrarMovimentacoes(
                            filtro.dataset.filtro
                        );

                    }
                );

            }
        );


        // =====================================================
        // BOTÃO TODAS
        // =====================================================

        limparFiltro.addEventListener(
            "click",
            () => {

                filtros.forEach(
                    botao => {

                        botao.classList.remove(
                            "ativo"
                        );

                    }
                );


                document
                    .querySelector(
                        '[data-filtro="todos"]'
                    )
                    .classList.add(
                        "ativo"
                    );


                mostrarMovimentacoes(
                    "todos"
                );

            }
        );


        // =====================================================
        // PROTEÇÃO CONTRA HTML
        // =====================================================

        function escaparHTML(valor) {

            const div =
                document.createElement(
                    "div"
                );

            div.textContent =
                String(valor ?? "");

            return div.innerHTML;

        }


        // =====================================================
        // INICIAR
        // =====================================================

        carregarExtrato();

    </script>

</body>

</html>
