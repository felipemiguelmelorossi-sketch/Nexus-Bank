<!DOCTYPE html>

<html lang="pt-BR">

<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Nexus Bank</title>

<link
    rel="stylesheet"
    href="style.css"
>

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="supabase.js"></script>
```

</head>

<body>

```
<header class="topbar">

    <div class="logo">
        Nexus<span>Bank</span>
    </div>

    <button
        class="profile-button"
        id="logoutButton"
        title="Sair"
        type="button"
    >
        Sair
    </button>

</header>


<main class="container">

    <section class="welcome">

        <p>
            Olá!
        </p>

        <h1>
            Bem-vindo ao Nexus Bank
        </h1>

        <p data-user-email></p>

    </section>


    <section class="balance-card">

        <div>

            <p class="balance-title">
                Saldo disponível
            </p>

            <h2 id="balance">
                R$ 0,00
            </h2>

        </div>

        <button
            id="toggleBalance"
            type="button"
            aria-label="Mostrar ou ocultar saldo"
        >
            Mostrar
        </button>

    </section>


    <section class="quick-actions">

        <button
            class="action"
            type="button"
            onclick="location.href='pix.html'"
        >

            <div>
                PIX
            </div>

            <span>
                PIX
            </span>

        </button>


        <button
            class="action"
            type="button"
            onclick="location.href='enviar-pix.html'"
        >

            <div>
                Transferir
            </div>

            <span>
                Transferir
            </span>

        </button>


        <button
            class="action"
            type="button"
            onclick="location.href='receber-pix.html'"
        >

            <div>
                Receber
            </div>

            <span>
                Receber
            </span>

        </button>


        <button
            class="action"
            type="button"
            onclick="location.href='extrato.html'"
        >

            <div>
                Extrato
            </div>

            <span>
                Extrato
            </span>

        </button>

    </section>


    <section class="transactions">

        <div class="section-header">

            <h2>
                Últimas movimentações
            </h2>

            <button
                type="button"
                onclick="location.href='extrato.html'"
            >
                Ver tudo
            </button>

        </div>


        <div class="empty-state">

            <div class="empty-icon">
                Nexus
            </div>

            <h3>
                Nenhuma movimentação
            </h3>

            <p>
                Suas transações aparecerão aqui.
            </p>

        </div>

    </section>

</main>


<nav class="bottom-nav">

    <button
        class="active"
        type="button"
        onclick="location.href='index.html'"
    >

        <span>
            Início
        </span>

    </button>


    <button
        type="button"
        onclick="location.href='pix.html'"
    >

        <span>
            PIX
        </span>

    </button>


    <button
        type="button"
        onclick="location.href='extrato.html'"
    >

        <span>
            Extrato
        </span>

    </button>


    <button
        type="button"
        id="profileNavButton"
    >

        <span>
            Perfil
        </span>

    </button>

</nav>


<script src="script.js"></script>
```

</body>

</html>
