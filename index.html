<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BancoPix</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
</head>

<body>

    <!-- HEADER -->

    <header class="topbar">

        <div class="logo">
            Banco<span>Pix</span>
        </div>

        <button
            class="profile-button"
            id="logoutButton"
            title="Sair"
            type="button"
        >
            👤
        </button>

    </header>


    <!-- CONTEÚDO -->

    <main class="container">

        <!-- BOAS-VINDAS -->

        <section class="welcome">

            <p>Olá! 👋</p>

            <h1>
                Bem-vindo ao BancoPix
            </h1>

            <p data-user-email></p>

        </section>


        <!-- SALDO -->

        <section class="balance-card">

            <div>

                <p class="balance-title">
                    Saldo disponível
                </p>

                <h2 id="balance">
                    R$ 0,00
                </h2>

            </div>

            <button
                id="toggleBalance"
                type="button"
                aria-label="Mostrar ou ocultar saldo"
            >
                👁️
            </button>

        </section>


        <!-- AÇÕES RÁPIDAS -->

        <section class="quick-actions">

            <!-- PIX -->

            <button
                class="action"
                type="button"
                onclick="location.href='pix.html'"
            >

                <div>
                    ⚡
                </div>

                <span>
                    PIX
                </span>

            </button>


            <!-- TRANSFERIR -->

            <button
                class="action"
                type="button"
                onclick="location.href='pix.html'"
            >

                <div>
                    💸
                </div>

                <span>
                    Transferir
                </span>

            </button>


            <!-- RECEBER -->

            <button
                class="action"
                type="button"
                onclick="location.href='pix.html'"
            >

                <div>
                    📥
                </div>

                <span>
                    Receber
                </span>

            </button>


            <!-- EXTRATO -->

            <button
                class="action"
                type="button"
            >

                <div>
                    📋
                </div>

                <span>
                    Extrato
                </span>

            </button>

        </section>


        <!-- MOVIMENTAÇÕES -->

        <section class="transactions">

            <div class="section-header">

                <h2>
                    Últimas movimentações
                </h2>

                <button
                    type="button"
                >
                    Ver tudo
                </button>

            </div>


            <div class="empty-state">

                <div class="empty-icon">
                    💳
                </div>

                <h3>
                    Nenhuma movimentação
                </h3>

                <p>
                    Suas transações aparecerão aqui.
                </p>

            </div>

        </section>

    </main>


    <!-- MENU INFERIOR -->

    <nav class="bottom-nav">

        <!-- INÍCIO -->

        <button
            class="active"
            type="button"
        >

            <span>
                ⌂
            </span>

            Início

        </button>


        <!-- PIX -->

        <button
            type="button"
            onclick="location.href='pix.html'"
        >

            <span>
                ⚡
            </span>

            PIX

        </button>


        <!-- EXTRATO -->

        <button
            type="button"
        >

            <span>
                📋
            </span>

            Extrato

        </button>


        <!-- PERFIL -->

        <button
            type="button"
        >

            <span>
                👤
            </span>

            Perfil

        </button>

    </nav>


    <!-- SCRIPT -->

    <script src="script.js"></script>

</body>

</html>
