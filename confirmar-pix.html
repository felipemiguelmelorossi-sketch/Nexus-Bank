<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Confirmar PIX — BancoPix</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
</head>

<body>

    <header class="topbar">

        <div class="logo">
            Banco<span>Pix</span>
        </div>

        <button
            class="profile-button"
            type="button"
            onclick="location.href='enviar-pix.html'"
        >
            ←
        </button>

    </header>


    <main class="auth-container">

        <div class="auth-card">

            <div class="logo">
                Banco<span>Pix</span>
            </div>

            <h1>
                Confirmar PIX
            </h1>

            <p class="subtitle">
                Confira os dados antes de continuar.
            </p>


            <div class="pix-confirm-box">

                <p class="pix-confirm-label">
                    Chave PIX
                </p>

                <strong id="confirmChave">
                    —
                </strong>


                <p class="pix-confirm-label">
                    Valor
                </p>

                <strong id="confirmValor">
                    R$ 0,00
                </strong>


                <p class="pix-confirm-label">
                    Descrição
                </p>

                <strong id="confirmDescricao">
                    —
                </strong>

            </div>


            <button
                class="primary-button"
                id="confirmButton"
                type="button"
            >
                Confirmar PIX
            </button>


            <button
                class="secondary-button"
                type="button"
                onclick="location.href='enviar-pix.html'"
            >
                Voltar
            </button>


            <p
                id="confirmMessage"
                aria-live="polite"
            ></p>

        </div>

    </main>


    <script>

        // =====================================================
        // PEGAR DADOS DA URL
        // =====================================================

        const params =
            new URLSearchParams(
                window.location.search
            );


        const chave =
            params.get("chave") || "";


        const valor =
            Number(
                params.get("valor") || 0
            );


        const descricao =
            params.get("descricao") ||
            "PIX enviado";


        // =====================================================
        // MOSTRAR DADOS
        // =====================================================

        document.getElementById(
            "confirmChave"
        ).textContent =
            chave || "Não informada";


        document.getElementById(
            "confirmValor"
        ).textContent =
            valor > 0
                ? valor.toLocaleString(
                    "pt-BR",
                    {
                        style: "currency",
                        currency: "BRL"
                    }
                )
                : "R$ 0,00";


        document.getElementById(
            "confirmDescricao"
        ).textContent =
            descricao;


        // =====================================================
        // BOTÃO CONFIRMAR
        // =====================================================

        const confirmButton =
            document.getElementById(
                "confirmButton"
            );


        const confirmMessage =
            document.getElementById(
                "confirmMessage"
            );


        confirmButton.addEventListener(
            "click",
            async function() {

                // -------------------------------
                // VALIDAÇÃO
                // -------------------------------

                if (!chave || !valor || valor <= 0) {

                    mostrarMensagem(
                        "Dados do PIX inválidos.",
                        "#dc2626"
                    );

                    return;

                }


                confirmButton.disabled =
                    true;

                confirmButton.textContent =
                    "Registrando...";


                try {

                    // -------------------------------
                    // VERIFICAR USUÁRIO
                    // -------------------------------

                    const {
                        data: {
                            session
                        },
                        error: sessionError
                    } =
                        await supabaseClient.auth
                            .getSession();


                    if (sessionError) {
                        throw sessionError;
                    }


                    if (!session) {

                        window.location.href =
                            "login.html";

                        return;

                    }


                    // -------------------------------
                    // SALVAR TRANSAÇÃO
                    // -------------------------------

                    const {
                        error
                    } =
                        await supabaseClient
                            .from("transactions")
                            .insert({

                                user_id:
                                    session.user.id,

                                tipo:
                                    "saida",

                                titulo:
                                    "PIX enviado",

                                descricao:
                                    descricao,

                                valor:
                                    valor

                            });


                    if (error) {
                        throw error;
                    }


                    // -------------------------------
                    // SUCESSO
                    // -------------------------------

                    mostrarMensagem(
                        "PIX de teste registrado com sucesso!",
                        "#16a34a"
                    );


                    confirmButton.textContent =
                        "PIX registrado";


                    // Ir para o extrato

                    setTimeout(
                        function() {

                            window.location.href =
                                "extrato.html";

                        },
                        1000
                    );


                } catch (error) {

                    console.error(
                        "Erro ao registrar PIX:",
                        error
                    );


                    mostrarMensagem(
                        error.message ||
                        "Não foi possível registrar o PIX.",
                        "#dc2626"
                    );


                    confirmButton.disabled =
                        false;

                    confirmButton.textContent =
                        "Confirmar PIX";

                }

            }
        );


        // =====================================================
        // MENSAGEM
        // =====================================================

        function mostrarMensagem(
            mensagem,
            cor
        ) {

            confirmMessage.textContent =
                mensagem;

            confirmMessage.style.color =
                cor;

        }

    </script>

</body>

</html>
