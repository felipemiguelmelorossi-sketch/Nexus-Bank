<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Criar conta — Nexus Bank</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

</head>


<body class="auth-page">


    <main class="auth-container">


        <div class="auth-card auth-card-large">


            <div class="brand">
                <span>Nexus</span> Bank
            </div>


            <div class="auth-header">

                <h1>
                    Crie sua conta
                </h1>

                <p>
                    Abra sua conta Nexus Bank.
                </p>

            </div>


            <form id="registerForm">


                <div class="field">

                    <label for="nome">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Seu nome completo"
                        autocomplete="name"
                        required
                    >

                </div>


                <div class="field">

                    <label for="cpf">
                        CPF
                    </label>

                    <input
                        type="text"
                        id="cpf"
                        placeholder="000.000.000-00"
                        maxlength="14"
                        required
                    >

                </div>


                <div class="field">

                    <label for="cep">
                        CEP
                    </label>

                    <input
                        type="text"
                        id="cep"
                        placeholder="00000-000"
                        maxlength="9"
                        required
                    >

                </div>


                <div class="field">

                    <label for="dataNascimento">
                        Data de nascimento
                    </label>

                    <input
                        type="date"
                        id="dataNascimento"
                        required
                    >

                </div>


                <div class="field">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="seu@email.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="field">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Crie uma senha"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >

                    <small>
                        Use pelo menos 6 caracteres.
                    </small>

                </div>


                <div class="field">

                    <label for="tipoPix">
                        Tipo de chave PIX
                    </label>

                    <select
                        id="tipoPix"
                        required
                    >

                        <option value="">
                            Selecione o tipo de chave
                        </option>

                        <option value="cpf">
                            CPF
                        </option>

                        <option value="email">
                            E-mail
                        </option>

                        <option value="aleatoria">
                            Chave aleatória
                        </option>

                    </select>

                </div>


                <button
                    type="submit"
                    class="primary-button"
                    id="registerButton"
                >
                    Criar minha conta
                </button>


            </form>


            <p
                id="message"
                class="form-message"
                aria-live="polite"
            ></p>


            <div class="auth-footer">

                <span>
                    Já possui uma conta?
                </span>

                <a href="login.html">
                    Entrar
                </a>

            </div>


        </div>


    </main>


    <script>

        const form =
            document.getElementById(
                "registerForm"
            );


        const message =
            document.getElementById(
                "message"
            );


        const button =
            document.getElementById(
                "registerButton"
            );


        // ==========================================
        // MÁSCARA CPF
        // ==========================================

        document
            .getElementById("cpf")
            .addEventListener(
                "input",
                function() {

                    let v =
                        this.value.replace(
                            /\D/g,
                            ""
                        );


                    v =
                        v.substring(
                            0,
                            11
                        );


                    if (v.length > 9) {

                        v =
                            v.replace(
                                /^(\d{3})(\d{3})(\d{3})(\d{1,2})$/,
                                "$1.$2.$3-$4"
                            );

                    } else if (v.length > 6) {

                        v =
                            v.replace(
                                /^(\d{3})(\d{3})(\d{1,3})$/,
                                "$1.$2.$3"
                            );

                    } else if (v.length > 3) {

                        v =
                            v.replace(
                                /^(\d{3})(\d{1,3})$/,
                                "$1.$2"
                            );

                    }


                    this.value = v;

                }
            );


        // ==========================================
        // MÁSCARA CEP
        // ==========================================

        document
            .getElementById("cep")
            .addEventListener(
                "input",
                function() {

                    let v =
                        this.value.replace(
                            /\D/g,
                            ""
                        );


                    v =
                        v.substring(
                            0,
                            8
                        );


                    if (v.length > 5) {

                        v =
                            v.substring(
                                0,
                                5
                            ) +
                            "-" +
                            v.substring(
                                5
                            );

                    }


                    this.value = v;

                }
            );


        // ==========================================
        // CADASTRO
        // ==========================================

        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                message.textContent = "";
                message.className =
                    "form-message";


                // ----------------------------------
                // VERIFICAR SUPABASE
                // ----------------------------------

                if (!window.supabaseClient) {

                    mostrarMensagem(
                        "O Supabase não foi carregado. Verifique o arquivo supabase.js.",
                        false
                    );

                    return;

                }


                // ----------------------------------
                // PEGAR CAMPOS
                // ----------------------------------

                const nome =
                    document
                        .getElementById("nome")
                        .value
                        .trim();


                const cpf =
                    document
                        .getElementById("cpf")
                        .value
                        .trim();


                const cep =
                    document
                        .getElementById("cep")
                        .value
                        .trim();


                const dataNascimento =
                    document
                        .getElementById("dataNascimento")
                        .value;


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const senha =
                    document
                        .getElementById("senha")
                        .value;


                const tipoPix =
                    document
                        .getElementById("tipoPix")
                        .value;


                // ----------------------------------
                // VALIDAÇÃO
                // ----------------------------------

                if (
                    !nome ||
                    !cpf ||
                    !cep ||
                    !dataNascimento ||
                    !email ||
                    !senha ||
                    !tipoPix
                ) {

                    mostrarMensagem(
                        "Preencha todos os campos.",
                        false
                    );

                    return;

                }


                if (senha.length < 6) {

                    mostrarMensagem(
                        "A senha precisa ter pelo menos 6 caracteres.",
                        false
                    );

                    return;

                }


                // ----------------------------------
                // BOTÃO
                // ----------------------------------

                button.disabled = true;

                button.textContent =
                    "Criando conta...";


                try {

                    // --------------------------------
                    // CRIAR CONTA AUTH
                    // --------------------------------

                    const resultado =
                        await window.supabaseClient.auth
                            .signUp({

                                email: email,

                                password: senha

                            });


                    const data =
                        resultado.data;


                    const error =
                        resultado.error;


                    if (error) {

                        throw error;

                    }


                    if (!data || !data.user) {

                        throw new Error(
                            "O Supabase não retornou o usuário."
                        );

                    }


                    // --------------------------------
                    // SE JÁ EXISTIR SESSÃO
                    // --------------------------------

                    if (data.session) {

                        const perfil =
                            await window.supabaseClient
                                .from("profiles")
                                .insert({

                                    id:
                                        data.user.id,

                                    nome_completo:
                                        nome,

                                    cpf:
                                        cpf,

                                    cep:
                                        cep,

                                    data_nascimento:
                                        dataNascimento,

                                    tipo_chave_pix:
                                        tipoPix

                                });


                        if (perfil.error) {

                            throw perfil.error;

                        }


                        mostrarMensagem(
                            "Conta criada com sucesso.",
                            true
                        );


                        setTimeout(
                            function() {

                                window.location.href =
                                    "index.html";

                            },
                            800
                        );


                    } else {

                        // --------------------------------
                        // CONFIRMAÇÃO DE E-MAIL ATIVADA
                        // --------------------------------

                        mostrarMensagem(
                            "Conta criada. Verifique seu e-mail para confirmar o cadastro.",
                            true
                        );


                        form.reset();

                    }


                } catch (error) {

                    console.error(
                        "ERRO NO CADASTRO:",
                        error
                    );


                    mostrarMensagem(
                        traduzirErroSupabase(error),
                        false
                    );


                } finally {

                    button.disabled =
                        false;

                    button.textContent =
                        "Criar minha conta";

                }

            }
        );


        // ==========================================
        // MENSAGEM
        // ==========================================

        function mostrarMensagem(
            texto,
            sucesso
        ) {

            message.textContent =
                texto;


            message.className =
                sucesso
                    ? "form-message success"
                    : "form-message error";

        }


        // ==========================================
        // ERROS DO SUPABASE
        // ==========================================

        function traduzirErroSupabase(error) {

            if (!error) {

                return "Ocorreu um erro.";

            }


            const texto =
                String(
                    error.message || error
                ).toLowerCase();


            if (
                texto.includes(
                    "user already registered"
                )
            ) {

                return "Este e-mail já está cadastrado.";

            }


            if (
                texto.includes(
                    "password"
                )
            ) {

                return "A senha precisa ter pelo menos 6 caracteres.";

            }


            if (
                texto.includes(
                    "rate limit"
                )
            ) {

                return "Muitas tentativas. Aguarde um pouco.";

            }


            if (
                texto.includes(
                    "invalid api key"
                )
            ) {

                return "A chave do Supabase está incorreta.";

            }


            if (
                texto.includes(
                    "failed to fetch"
                )
            ) {

                return "Não foi possível conectar ao Supabase.";

            }


            return (
                error.message ||
                "Não foi possível criar a conta."
            );

        }

    </script>

</body>

</html>
