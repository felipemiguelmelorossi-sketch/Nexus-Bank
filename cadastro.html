<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Criar conta — BancoPix</title>

    <link rel="stylesheet" href="style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
</head>

<body>

    <main class="auth-container">

        <div class="auth-card">

            <div class="logo">
                Banco<span>Pix</span>
            </div>

            <h1>Crie sua conta</h1>

            <p class="subtitle">
                Crie sua conta para acessar o BancoPix.
            </p>

            <form id="registerForm">

                <label for="nome">
                    Nome completo
                </label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome completo"
                    autocomplete="name"
                    required
                >

                <label for="cpf">
                    CPF
                </label>

                <input
                    type="text"
                    id="cpf"
                    placeholder="000.000.000-00"
                    maxlength="14"
                    autocomplete="off"
                    required
                >

                <label for="cep">
                    CEP
                </label>

                <input
                    type="text"
                    id="cep"
                    placeholder="00000-000"
                    maxlength="9"
                    autocomplete="postal-code"
                    required
                >

                <label for="dataNascimento">
                    Data de nascimento
                </label>

                <input
                    type="date"
                    id="dataNascimento"
                    required
                >

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="seu@email.com"
                    autocomplete="email"
                    required
                >

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Crie uma senha"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

                <label for="tipoPix">
                    Tipo de chave PIX
                </label>

                <select id="tipoPix" required>

                    <option value="">
                        Selecione uma opção
                    </option>

                    <option value="cpf">
                        CPF
                    </option>

                    <option value="email">
                        E-mail
                    </option>

                    <option value="aleatoria">
                        Chave aleatória
                    </option>

                </select>

                <button
                    type="submit"
                    class="primary-button"
                    id="registerButton"
                >
                    Criar minha conta
                </button>

            </form>

            <p
                id="message"
                aria-live="polite"
            ></p>

            <p class="login-link">
                Já possui uma conta?
                <a href="login.html">
                    Entrar
                </a>
            </p>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
