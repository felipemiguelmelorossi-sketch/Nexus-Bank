<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Criar conta — Nexus Bank</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="supabase.js"></script>

</head>


<body class="auth-page">


    <main class="auth-container">


        <div class="auth-card auth-card-large">


            <!-- MARCA -->

            <div class="brand">
                <span>Nexus</span> Bank
            </div>


            <!-- CABEÇALHO -->

            <div class="auth-header">

                <h1>
                    Crie sua conta
                </h1>

                <p>
                    Abra sua conta Nexus Bank.
                </p>

            </div>


            <!-- FORMULÁRIO -->

            <form id="registerForm">


                <!-- NOME -->

                <div class="field">

                    <label for="nome">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Seu nome completo"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- CPF -->

                <div class="field">

                    <label for="cpf">
                        CPF
                    </label>

                    <input
                        type="text"
                        id="cpf"
                        placeholder="000.000.000-00"
                        maxlength="14"
                        autocomplete="off"
                        required
                    >

                </div>


                <!-- CEP -->

                <div class="field">

                    <label for="cep">
                        CEP
                    </label>

                    <input
                        type="text"
                        id="cep"
                        placeholder="00000-000"
                        maxlength="9"
                        autocomplete="postal-code"
                        required
                    >

                </div>


                <!-- NASCIMENTO -->

                <div class="field">

                    <label for="dataNascimento">
                        Data de nascimento
                    </label>

                    <input
                        type="date"
                        id="dataNascimento"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="field">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="seu@email.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- SENHA -->

                <div class="field">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Crie uma senha"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >

                    <small>
                        Use pelo menos 6 caracteres.
                    </small>

                </div>


                <!-- CHAVE PIX -->

                <div class="field">

                    <label for="tipoPix">
                        Tipo de chave PIX
                    </label>

                    <select
                        id="tipoPix"
                        required
                    >

                        <option value="">
                            Selecione o tipo de chave
                        </option>

                        <option value="cpf">
                            CPF
                        </option>

                        <option value="email">
                            E-mail
                        </option>

                        <option value="aleatoria">
                            Chave aleatória
                        </option>

                    </select>

                </div>


                <!-- BOTÃO -->

                <button
                    type="submit"
                    class="primary-button"
                    id="registerButton"
                >
                    Criar minha conta
                </button>


            </form>


            <!-- MENSAGEM -->

            <p
                id="message"
                class="form-message"
                aria-live="polite"
            ></p>


            <!-- LOGIN -->

            <div class="auth-footer">

                <span>
                    Já possui uma conta?
                </span>

                <a href="login.html">
                    Entrar
                </a>

            </div>


        </div>


    </main>


    <script>

        // =====================================================
        // ELEMENTOS
        // =====================================================

        const form =
            document.getElementById(
                "registerForm"
            );


        const message =
            document.getElementById(
                "message"
            );


        const button =
            document.getElementById(
                "registerButton"
            );


        // =====================================================
        // VERIFICAR SUPABASE
        // =====================================================

        if (!window.supabaseClient) {

            mostrarMensagem(
                "Erro: o Supabase não foi carregado. Verifique o arquivo supabase.js.",
                false
            );

        }


        // =====================================================
        // MÁSCARA CPF
        // =====================================================

        document
            .getElementById("cpf")
            .addEventListener(
                "input",
                function() {

                    let valor =
                        this.value.replace(
                            /\D/g,
                            ""
                        );


                    valor =
                        valor.substring(
                            0,
                            11
                        );


                    if (
                        valor.length >= 10
                    ) {

                        valor =
                            valor.replace(
                                /^(\d{3})(\d{3})(\d{3})(\d{1,2})$/,
                                "$1.$2.$3-$4"
                            );

                    } else if (
                        valor.length >= 7
                    ) {

                        valor =
                            valor.replace(
                                /^(\d{3})(\d{3})(\d{1,3})$/,
                                "$1.$2.$3"
                            );

                    } else if (
                        valor.length >= 4
                    ) {

                        valor =
                            valor.replace(
                                /^(\d{3})(\d{1,3})$/,
                                "$1.$2"
                            );

                    }


                    this.value =
                        valor;

                }
            );


        // =====================================================
        // MÁSCARA CEP
        // =====================================================

        document
            .getElementById("cep")
            .addEventListener(
                "input",
                function() {

                    let valor =
                        this.value.replace(
                            /\D/g,
                            ""
                        );


                    valor =
                        valor.substring(
                            0,
                            8
                        );


                    if (
                        valor.length > 5
                    ) {

                        valor =
                            valor.substring(
                                0,
                                5
                            ) +
                            "-" +
                            valor.substring(
                                5
                            );

                    }


                    this.value =
                        valor;

                }
            );


        // =====================================================
        // CADASTRO
        // =====================================================

        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                // Limpar mensagem anterior

                message.textContent =
                    "";

                message.className =
                    "form-message";


                // Verificar Supabase

                if (
                    !window.supabaseClient
                ) {

                    mostrarMensagem(
                        "Não foi possível conectar ao Supabase.",
                        false
                    );

                    return;

                }


                // =================================================
                // PEGAR VALORES
                // =================================================

                const nome =
                    document
                        .getElementById("nome")
                        .value
                        .trim();


                const cpf =
                    document
                        .getElementById("cpf")
                        .value
                        .trim();


                const cep =
                    document
                        .getElementById("cep")
                        .value
                        .trim();


                const dataNascimento =
                    document
                        .getElementById(
                            "dataNascimento"
                        )
                        .value;


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const senha =
                    document
                        .getElementById("senha")
                        .value;


                const tipoPix =
                    document
                        .getElementById("tipoPix")
                        .value;


                // =================================================
                // VALIDAÇÕES
                // =================================================

                if (
                    !nome ||
                    !cpf ||
                    !cep ||
                    !dataNascimento ||
                    !email ||
                    !senha ||
                    !tipoPix
                ) {

                    mostrarMensagem(
                        "Preencha todos os campos.",
                        false
                    );

                    return;

                }


                if (
                    senha.length < 6
                ) {

                    mostrarMensagem(
                        "A senha precisa ter pelo menos 6 caracteres.",
                        false
                    );

                    return;

                }


                // =================================================
                // BOTÃO
                // =================================================

                button.disabled =
                    true;

                button.textContent =
                    "Criando...";


                try {

                    // =============================================
                    // CRIAR CONTA
                    // =============================================

                    const resultado =
                        await window
                            .supabaseClient
                            .auth
                            .signUp({

                                email:
                                    email,

                                password:
                                    senha

                            });


                    const data =
                        resultado.data;


                    const error =
                        resultado.error;


                    // =============================================
                    // ERRO NO SUPABASE AUTH
                    // =============================================

                    if (error) {

                        throw error;

                    }


                    if (
                        !data ||
                        !data.user
                    ) {

                        throw new Error(
                            "O Supabase não retornou os dados da conta."
                        );

                    }


                    console.log(
                        "Usuário criado:",
                        data.user.id
                    );


                    // =============================================
                    // USUÁRIO ENTROU AUTOMATICAMENTE
                    // =============================================

                    if (
                        data.session
                    ) {

                        console.log(
                            "Sessão criada. Salvando perfil..."
                        );


                        const perfil =
                            await window
                                .supabaseClient
                                .from("profiles")
                                .insert({

                                    id:
                                        data.user.id,

                                    nome_completo:
                                        nome,

                                    cpf:
                                        cpf,

                                    cep:
                                        cep,

                                    data_nascimento:
                                        dataNascimento,

                                    tipo_chave_pix:
                                        tipoPix

                                });


                        // =========================================
                        // ERRO NO PERFIL
                        // =========================================

                        if (
                            perfil.error
                        ) {

                            console.error(
                                "Erro no perfil:",
                                perfil.error
                            );


                            throw new Error(
                                "A conta foi criada, mas os dados do perfil não puderam ser salvos: " +
                                perfil.error.message
                            );

                        }


                        // =========================================
                        // SUCESSO
                        // =========================================

                        mostrarMensagem(
                            "Conta criada com sucesso.",
                            true
                        );


                        button.textContent =
                            "Conta criada";


                        setTimeout(
                            function() {

                                window.location.href =
                                    "index.html";

                            },
                            1000
                        );


                    } else {

                        // =========================================
                        // CONFIRMAÇÃO DE EMAIL
                        // =========================================

                        console.log(
                            "Conta criada. Aguardando confirmação de e-mail."
                        );


                        mostrarMensagem(
                            "Conta criada. Verifique seu e-mail para confirmar o cadastro.",
                            true
                        );


                        button.textContent =
                            "Conta criada";


                        form.reset();

                    }


                } catch (error) {

                    console.error(
                        "ERRO COMPLETO:",
                        error
                    );


                    // =============================================
                    // MOSTRAR ERRO
                    // =============================================

                    mostrarMensagem(
                        traduzirErroSupabase(
                            error
                        ),
                        false
                    );


                    button.disabled =
                        false;

                    button.textContent =
                        "Criar minha conta";

                }

            }
        );


        // =====================================================
        // MOSTRAR MENSAGEM
        // =====================================================

        function mostrarMensagem(
            texto,
            sucesso
        ) {

            message.textContent =
                texto;


            message.className =
                sucesso
                    ? "form-message success"
                    : "form-message error";

        }


        // =====================================================
        // TRADUZIR ERROS
        // =====================================================

        function traduzirErroSupabase(
            error
        ) {

            if (!error) {

                return "Ocorreu um erro.";

            }


            const texto =
                String(
                    error.message ||
                    error
                );


            const textoMinusculo =
                texto.toLowerCase();


            if (
                textoMinusculo.includes(
                    "user already registered"
                )
            ) {

                return "Este e-mail já está cadastrado.";

            }


            if (
                textoMinusculo.includes(
                    "email"
                ) &&
                textoMinusculo.includes(
                    "invalid"
                )
            ) {

                return "Digite um e-mail válido.";

            }


            if (
                textoMinusculo.includes(
                    "password"
                )
            ) {

                return "A senha precisa ter pelo menos 6 caracteres.";

            }


            if (
                textoMinusculo.includes(
                    "rate limit"
                )
            ) {

                return "Muitas tentativas. Aguarde alguns minutos.";

            }


            if (
                textoMinusculo.includes(
                    "row-level security"
                )
            ) {

                return "A conta foi criada, mas o Supabase bloqueou o salvamento do perfil. Precisamos ajustar a configuração da tabela profiles.";

            }


            if (
                textoMinusculo.includes(
                    "permission denied"
                )
            ) {

                return "O Supabase bloqueou o acesso à tabela profiles.";

            }


            if (
                textoMinusculo.includes(
                    "failed to fetch"
                )
            ) {

                return "Não foi possível conectar ao Supabase.";

            }


            if (
                textoMinusculo.includes(
                    "invalid api key"
                )
            ) {

                return "A chave do Supabase está incorreta.";

            }


            return (
                texto ||
                "Não foi possível criar a conta."
            );

        }

    </script>

</body>

</html>
