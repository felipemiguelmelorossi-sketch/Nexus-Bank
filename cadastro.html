<body class="auth-page">

```
<main class="auth-container">

    <div class="auth-card auth-card-large">

        <div class="brand">
            <span>Nexus</span> Bank
        </div>

        <div class="auth-header">
            <h1>Crie sua conta</h1>
            <p>Abra sua conta Nexus Bank.</p>
        </div>

        <form id="registerForm" novalidate>

            <div class="field">
                <label for="nome">Nome completo</label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Seu nome completo"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="field">
                <label for="cpf">CPF</label>

                <input
                    type="text"
                    id="cpf"
                    placeholder="000.000.000-00"
                    maxlength="14"
                    inputmode="numeric"
                    autocomplete="off"
                    required
                >
            </div>

            <div class="field">
                <label for="cep">CEP</label>

                <input
                    type="text"
                    id="cep"
                    placeholder="00000-000"
                    maxlength="9"
                    inputmode="numeric"
                    autocomplete="postal-code"
                    required
                >
            </div>

            <div class="field">
                <label for="dataNascimento">
                    Data de nascimento
                </label>

                <input
                    type="date"
                    id="dataNascimento"
                    required
                >
            </div>

            <div class="field">
                <label for="email">E-mail</label>

                <input
                    type="email"
                    id="email"
                    placeholder="seu@email.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="field">
                <label for="senha">Senha</label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Crie uma senha"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

                <small>
                    Use pelo menos 6 caracteres.
                </small>
            </div>

            <div class="field">
                <label for="tipoPix">
                    Tipo de chave PIX
                </label>

                <select id="tipoPix" required>

                    <option value="">
                        Selecione o tipo de chave
                    </option>

                    <option value="cpf">
                        CPF
                    </option>

                    <option value="email">
                        E-mail
                    </option>

                    <option value="aleatoria">
                        Chave aleatória
                    </option>

                </select>
            </div>

            <button
                type="submit"
                class="primary-button"
                id="registerButton"
            >
                Criar minha conta
            </button>

        </form>

        <p
            id="message"
            class="form-message"
            aria-live="polite"
        ></p>

        <div class="auth-footer">

            <span>Já possui uma conta?</span>

            <a href="login.html">
                Entrar
            </a>

        </div>

    </div>

</main>

<script>

    "use strict";

    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");
    const button = document.getElementById("registerButton");

    const nomeInput = document.getElementById("nome");
    const cpfInput = document.getElementById("cpf");
    const cepInput = document.getElementById("cep");
    const dataInput = document.getElementById("dataNascimento");
    const emailInput = document.getElementById("email");
    const senhaInput = document.getElementById("senha");
    const tipoPixInput = document.getElementById("tipoPix");


    // =====================================================
    // VERIFICAR SUPABASE
    // =====================================================

    window.addEventListener("load", function () {

        if (!window.supabaseClient) {

            mostrarMensagem(
                "O sistema de cadastro não conseguiu carregar o Supabase. Verifique o arquivo supabase.js.",
                false
            );

            button.disabled = true;

        }

    });


    // =====================================================
    // CPF
    // =====================================================

    cpfInput.addEventListener("input", function () {

        let valor = this.value.replace(/\D/g, "");

        valor = valor.substring(0, 11);

        if (valor.length > 9) {

            valor = valor.replace(
                /^(\d{3})(\d{3})(\d{3})(\d{1,2})$/,
                "$1.$2.$3-$4"
            );

        } else if (valor.length > 6) {

            valor = valor.replace(
                /^(\d{3})(\d{3})(\d{1,3})$/,
                "$1.$2.$3"
            );

        } else if (valor.length > 3) {

            valor = valor.replace(
                /^(\d{3})(\d{1,3})$/,
                "$1.$2"
            );

        }

        this.value = valor;

    });


    // =====================================================
    // CEP
    // =====================================================

    cepInput.addEventListener("input", function () {

        let valor = this.value.replace(/\D/g, "");

        valor = valor.substring(0, 8);

        if (valor.length > 5) {

            valor =
                valor.substring(0, 5) +
                "-" +
                valor.substring(5);

        }

        this.value = valor;

    });


    // =====================================================
    // CADASTRO
    // =====================================================

    form.addEventListener("submit", async function (event) {

        event.preventDefault();
        event.stopPropagation();

        mostrarMensagem("", false);

        if (!window.supabaseClient) {

            mostrarMensagem(
                "Supabase não carregado. Verifique o arquivo supabase.js.",
                false
            );

            return;

        }


        // =================================================
        // PEGAR DADOS
        // =================================================

        const nome = nomeInput.value.trim();
        const cpf = cpfInput.value.trim();
        const cep = cepInput.value.trim();
        const dataNascimento = dataInput.value;
        const email = emailInput.value.trim();
        const senha = senhaInput.value;
        const tipoPix = tipoPixInput.value;


        // =================================================
        // VALIDAÇÕES
        // =================================================

        if (!nome) {

            mostrarMensagem(
                "Digite seu nome completo.",
                false
            );

            nomeInput.focus();
            return;

        }

        if (!cpf) {

            mostrarMensagem(
                "Digite o CPF.",
                false
            );

            cpfInput.focus();
            return;

        }

        if (!cep) {

            mostrarMensagem(
                "Digite o CEP.",
                false
            );

            cepInput.focus();
            return;

        }

        if (!dataNascimento) {

            mostrarMensagem(
                "Informe a data de nascimento.",
                false
            );

            dataInput.focus();
            return;

        }

        if (!email) {

            mostrarMensagem(
                "Digite seu e-mail.",
                false
            );

            emailInput.focus();
            return;

        }

        if (!senha) {

            mostrarMensagem(
                "Digite uma senha.",
                false
            );

            senhaInput.focus();
            return;

        }

        if (senha.length < 6) {

            mostrarMensagem(
                "A senha precisa ter pelo menos 6 caracteres.",
                false
            );

            senhaInput.focus();
            return;

        }

        if (!tipoPix) {

            mostrarMensagem(
                "Selecione o tipo de chave PIX.",
                false
            );

            tipoPixInput.focus();
            return;

        }


        // =================================================
        // DESABILITAR BOTÃO
        // =================================================

        button.disabled = true;
        button.textContent = "Criando...";


        try {

            console.log("Iniciando cadastro...");


            // =================================================
            // CRIAR USUÁRIO NO SUPABASE AUTH
            // =================================================

            const { data, error } =
                await window.supabaseClient.auth.signUp({

                    email: email,
                    password: senha

                });


            console.log("Resposta do Supabase:", data);


            if (error) {

                console.error(
                    "Erro no Auth:",
                    error
                );

                throw error;

            }


            if (!data || !data.user) {

                throw new Error(
                    "O Supabase não retornou o usuário criado."
                );

            }


            // =================================================
            // SE O SUPABASE JÁ CRIOU UMA SESSÃO
            // =================================================

            if (data.session) {

                console.log(
                    "Usuário autenticado. Criando perfil..."
                );


                const { error: perfilError } =
                    await window.supabaseClient
                        .from("profiles")
                        .insert({

                            id: data.user.id,

                            nome_completo: nome,

                            cpf: cpf,

                            cep: cep,

                            data_nascimento: dataNascimento,

                            tipo_chave_pix: tipoPix

                        });


                if (perfilError) {

                    console.error(
                        "Erro ao criar perfil:",
                        perfilError
                    );

                    throw new Error(
                        "A conta foi criada, mas o perfil não pôde ser salvo: " +
                        perfilError.message
                    );

                }


                mostrarMensagem(
                    "Conta criada com sucesso.",
                    true
                );

                button.textContent =
                    "Conta criada";


                setTimeout(function () {

                    window.location.href =
                        "index.html";

                }, 1000);


                return;

            }


            // =================================================
            // CONFIRMAÇÃO DE E-MAIL ATIVADA
            // =================================================

            console.log(
                "Conta criada. Aguardando confirmação de e-mail."
            );


            mostrarMensagem(
                "Conta criada. Verifique seu e-mail para confirmar o cadastro.",
                true
            );


            button.textContent =
                "Conta criada";


            form.reset();


        } catch (error) {

            console.error(
                "ERRO COMPLETO NO CADASTRO:",
                error
            );


            mostrarMensagem(
                traduzirErro(error),
                false
            );


            button.disabled = false;

            button.textContent =
                "Criar minha conta";

        }

    });


    // =====================================================
    // MENSAGEM
    // =====================================================

    function mostrarMensagem(texto, sucesso) {

        message.textContent = texto;

        if (!texto) {

            message.className =
                "form-message";

            return;

        }

        message.className =
            sucesso
                ? "form-message success"
                : "form-message error";

    }


    // =====================================================
    // TRADUZIR ERROS
    // =====================================================

    function traduzirErro(error) {

        if (!error) {

            return "Não foi possível criar a conta.";

        }


        const texto =
            String(
                error.message ||
                error
            );


        const erro =
            texto.toLowerCase();


        if (
            erro.includes("user already registered")
        ) {

            return "Este e-mail já está cadastrado.";

        }


        if (
            erro.includes("email") &&
            (
                erro.includes("invalid") ||
                erro.includes("valid")
            )
        ) {

            return "Digite um e-mail válido.";

        }


        if (
            erro.includes("password") ||
            erro.includes("senha")
        ) {

            return "A senha precisa ter pelo menos 6 caracteres.";

        }


        if (
            erro.includes("rate limit")
        ) {

            return "Muitas tentativas. Aguarde alguns minutos.";

        }


        if (
            erro.includes("row-level security") ||
            erro.includes("rls")
        ) {

            return "O Supabase bloqueou o salvamento do perfil pela segurança da tabela.";

        }


        if (
            erro.includes("permission denied")
        ) {

            return "O Supabase não permitiu acessar a tabela de perfil.";

        }


        if (
            erro.includes("failed to fetch") ||
            erro.includes("network")
        ) {

            return "Não foi possível conectar ao Supabase.";

        }


        if (
            erro.includes("invalid api key")
        ) {

            return "A chave pública do Supabase está incorreta.";

        }


        if (
            erro.includes("fetch")
        ) {

            return "Não foi possível conectar ao servidor.";

        }


        return texto;

    }

</script>
```
