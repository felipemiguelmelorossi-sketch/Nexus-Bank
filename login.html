<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Entrar — Nexus Bank</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
</head>

<body class="auth-page">

    <main class="auth-container">

        <div class="auth-card">

            <div class="brand">
                <span>Nexus</span> Bank
            </div>

            <div class="auth-header">

                <h1>
                    Entre na sua conta
                </h1>

                <p>
                    Acesse sua conta Nexus Bank.
                </p>

            </div>


            <form id="loginForm">

                <div class="field">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="seu@email.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="field">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Sua senha"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="primary-button"
                    id="loginButton"
                >
                    Entrar
                </button>

            </form>


            <p
                id="loginMessage"
                class="form-message"
                aria-live="polite"
            ></p>


            <div class="auth-footer">

                <span>
                    Ainda não possui uma conta?
                </span>

                <a href="cadastro.html">
                    Criar conta
                </a>

            </div>

        </div>

    </main>


    <script>

        const loginForm =
            document.getElementById("loginForm");

        const loginMessage =
            document.getElementById("loginMessage");

        const loginButton =
            document.getElementById("loginButton");


        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const senha =
                    document
                        .getElementById("senha")
                        .value;


                if (!email || !senha) {

                    mostrarMensagem(
                        "Preencha o e-mail e a senha.",
                        false
                    );

                    return;

                }


                loginButton.disabled = true;

                loginButton.textContent =
                    "Entrando";


                try {

                    const {
                        data,
                        error
                    } =
                        await supabaseClient.auth
                            .signInWithPassword({

                                email: email,

                                password: senha

                            });


                    if (error) {
                        throw error;
                    }


                    if (!data.user) {

                        throw new Error(
                            "Não foi possível entrar."
                        );

                    }


                    mostrarMensagem(
                        "Login realizado com sucesso.",
                        true
                    );


                    setTimeout(
                        function() {

                            window.location.href =
                                "index.html";

                        },
                        600
                    );


                } catch (error) {

                    console.error(
                        "Erro no login:",
                        error
                    );


                    mostrarMensagem(
                        traduzirErroSupabase(error),
                        false
                    );


                    loginButton.disabled =
                        false;

                    loginButton.textContent =
                        "Entrar";

                }

            }
        );


        function mostrarMensagem(
            mensagem,
            sucesso
        ) {

            loginMessage.textContent =
                mensagem;

            loginMessage.className =
                sucesso
                    ? "form-message success"
                    : "form-message error";

        }

    </script>

</body>

</html>
