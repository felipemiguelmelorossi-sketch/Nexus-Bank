<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Entrar — BancoPix</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
</head>

<body>

    <main class="auth-container">

        <div class="auth-card">

            <div class="logo">
                Banco<span>Pix</span>
            </div>

            <h1>Bem-vindo de volta</h1>

            <p class="subtitle">
                Entre na sua conta BancoPix.
            </p>

            <form id="loginForm">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="seu@email.com"
                    autocomplete="email"
                    required
                >

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="submit"
                    class="primary-button"
                    id="loginButton"
                >
                    Entrar
                </button>

            </form>

            <p
                id="loginMessage"
                aria-live="polite"
            ></p>

            <p class="login-link">
                Ainda não possui uma conta?
                <a href="cadastro.html">
                    Criar conta
                </a>
            </p>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
